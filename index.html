<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для моей кисули ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #080a0f; color: #f3f4f6; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; overflow-x: hidden; position: relative; }
        
        .magic-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
        .floating-element { position: absolute; opacity: 0.2; animation: floatAround 12s infinite ease-in-out; }
        @keyframes floatAround {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* 5 Полароид-фоток в рандомных местах с разным наклоном */
        .polaroid-photo {
            position: absolute;
            background: #fff;
            padding: 7px 7px 14px 7px;
            border-radius: 4px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            width: 105px;
            z-index: 2;
            pointer-events: none;
        }
        .polaroid-photo img { width: 100%; height: 95px; object-fit: cover; border-radius: 2px; display: block; }

        /* Разброс по разным координатам */
        .p-1 { top: 5%; left: 8%; transform: rotate(-12deg); }
        .p-2 { top: 10%; right: 7%; transform: rotate(14deg); }
        .p-3 { bottom: 8%; left: 7%; transform: rotate(8deg); }
        .p-4 { bottom: 12%; right: 8%; transform: rotate(-10deg); }
        .p-5 { top: 44%; left: 2%; transform: rotate(-5deg); }

        /* Адаптив для телефонов, чтобы фотки не перекрывали интерфейс */
        @media (max-width: 768px) {
            .polaroid-photo { width: 72px; padding: 5px 5px 10px 5px; }
            .polaroid-photo img { height: 62px; }
            .p-1 { top: 12px; left: 12px; transform: rotate(-8deg); }
            .p-2 { top: 12px; right: 12px; transform: rotate(10deg); }
            .p-3 { bottom: 12px; left: 12px; transform: rotate(6deg); }
            .p-4 { bottom: 12px; right: 12px; transform: rotate(-8deg); }
            .p-5 { top: 48%; left: 4px; transform: rotate(-4deg); }
        }

        .container { width: 100%; max-width: 380px; background: rgba(18, 22, 33, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(244, 162, 97, 0.25); border-radius: 28px; padding: 26px 22px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8); position: relative; z-index: 5; }
        .header-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(244, 162, 97, 0.1); color: #f4a261; font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(244, 162, 97, 0.2); margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
        .subtitle { font-size: 13.5px; color: #94a3b8; line-height: 1.5; margin-bottom: 22px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff; padding: 15px 18px; border-radius: 16px; font-size: 14.5px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .option-btn:hover { background: rgba(244, 162, 97, 0.08); border-color: rgba(244, 162, 97, 0.35); }
        .option-btn svg { width: 16px; height: 16px; stroke: #f4a261; }
        .response-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(244, 162, 97, 0.15); border-radius: 18px; padding: 18px; margin-bottom: 18px; font-size: 13.5px; color: #e2e8f0; line-height: 1.6; }
        .movie-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); color: #e2e8f0; padding: 12px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; width: 100%; text-align: left; margin-bottom: 8px; }
        .movie-btn:hover { border-color: #f4a261; background: rgba(244, 162, 97, 0.06); }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="magic-bg">
    <div class="floating-element" style="left: 20%; animation-duration: 11s; font-size: 16px;">🌸</div>
    <div class="floating-element" style="left: 80%; animation-duration: 13s; font-size: 14px;">✨</div>
    <div class="floating-element" style="left: 50%; animation-duration: 9s; font-size: 18px;">💖</div>
</div>

<!-- Все 5 фотографий в рандомных точках -->
<div class="polaroid-photo p-1"><img src="1.jpg" alt="1"></div>
<div class="polaroid-photo p-2"><img src="2.jpg" alt="2"></div>
<div class="polaroid-photo p-3"><img src="3.jpg" alt="3"></div>
<div class="polaroid-photo p-4"><img src="4.jpg" alt="4"></div>
<div class="polaroid-photo p-5"><img src="5.jpg" alt="5"></div>

<div class="container">
    <div class="header-tag"><span>📸 Наши моменты</span></div>

    <div id="step-1">
        <h1>Доброе утречко, кисуля</h1>
        <p class="subtitle">Как ты себя чувствуешь после ночи? Выбирай состояние, режим восстановления запущен.</p>
        <div class="btn-group">
            <button class="option-btn" onclick="selectMood('better')">
                <span>Уже лучше ✨</span>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="option-btn" onclick="selectMood('worse')">
                <span>Не очень 🤒</span>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </div>

    <div id="step-2" class="hidden fade-in">
        <div class="response-card" id="response-text"></div>
        <div style="margin-bottom: 16px;">
            <p style="font-size: 11px; font-weight: 600; color: #f4a261; margin-bottom: 10px; text-transform: uppercase;">Кинозал на удаленке (Rave) 🎥</p>
            <button class="movie-btn" onclick="finishSelection()">☕️ Уютный сериал фоном</button>
            <button class="movie-btn" onclick="finishSelection()">🔥 Динамичное кино / боевик</button>
            <button class="movie-btn" onclick="finishSelection()">🍿 Легкая комедия</button>
        </div>
        <div id="final-block" class="hidden fade-in response-card" style="text-align: center; border-color: rgba(244, 162, 97, 0.3); background: rgba(244, 162, 97, 0.04);">
            <p style="color: #f4a261; font-weight: 600; font-size: 13px; margin-bottom: 6px;">Всё по плану ✨</p>
            <p style="color: #e2e8f0; font-size: 13.5px; margin: 0;">Люблю тебя очень-очень сильно. Скоро оба оклемаемся и наобнимаемся за все дни.</p>
        </div>
    </div>
</div>

<script>
    function selectMood(type) {
        document.getElementById('step-1').classList.add('hidden');
        const respBox = document.getElementById('response-text');
        if (type === 'better') {
            respBox.innerHTML = `<strong>Отличные новости! ☀️</strong><br>Меня невероятно радует, что ты идёшь на поправку. Жалко, что мы оба на карантине по разным углам, но как выздоровеем — всё наверстаем.`;
        } else {
            respBox.innerHTML = `<strong>Принято к исполнению 🛑</strong><br>Организм еще борется, поэтому сегодня строгий режим: плед 🌯, горячий чай 🫖 и полный игнор любых дел. Я на связи.`;
        }
        document.getElementById('step-2').classList.remove('hidden');
    }
    function finishSelection() {
        const finalBlock = document.getElementById('final-block');
        finalBlock.classList.remove('hidden');
        finalBlock.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
