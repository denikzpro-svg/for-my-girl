<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для моей кисули ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #0c0814;
            color: #fce7f3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(244, 114, 182, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.08) 0%, transparent 50%);
        }
        
        /* Множество падающих и летающих милых элементов */
        .magic-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
        .floating-item {
            position: absolute;
            opacity: 0.4;
            animation: floatUp 10s infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg) scale(0.8); opacity: 0; }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(26, 18, 38, 0.82);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(244, 114, 182, 0.3);
            border-radius: 36px;
            padding: 26px 22px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(244, 114, 182, 0.15);
            position: relative;
            z-index: 5;
        }

        /* Шапка с мур-контролем и котиком */
        .top-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            background: rgba(244, 114, 182, 0.08);
            border: 1px solid rgba(244, 114, 182, 0.2);
            padding: 10px 16px;
            border-radius: 22px;
        }
        .cat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #f472b6;
        }
        .cat-avatar {
            font-size: 20px;
            animation: bounceCat 2s infinite ease-in-out;
        }
        @keyframes bounceCat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(-5deg); }
        }

        .status-pill {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            font-size: 11px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        h1 {
            font-size: 23px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .heart-beat {
            display: inline-block;
            color: #ec4899;
            animation: heartbeat 1.2s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
        }

        .subtitle { font-size: 13.5px; color: #fbcfe8; line-height: 1.5; margin-bottom: 18px; }

        /* Полароидная лента с 5 фоточками */
        .polaroid-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 18px;
            scrollbar-width: none;
        }
        .polaroid-scroll::-webkit-scrollbar { display: none; }

        .polaroid-item {
            background: #fff;
            padding: 7px 7px 14px 7px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.25);
            min-width: 82px;
            flex-shrink: 0;
            transform: rotate(-3deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .polaroid-item:nth-child(even) { transform: rotate(3deg); }
        .polaroid-item:hover { transform: scale(1.1) rotate(0deg); z-index: 10; box-shadow: 0 15px 30px rgba(236, 72, 153, 0.4); }
        .polaroid-item img {
            width: 68px;
            height: 80px;
            object-fit: cover;
            border-radius: 3px;
            display: block;
        }

        /* Кнопки с красивыми розовыми градиентами */
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .option-btn {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.12) 0%, rgba(26, 18, 38, 0.8) 100%);
            border: 1px solid rgba(244, 114, 182, 0.3);
            color: #ffffff;
            padding: 15px 18px;
            border-radius: 20px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.08);
        }
        .option-btn:hover {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.25) 0%, rgba(26, 18, 38, 0.9) 100%);
            border-color: rgba(244, 114, 182, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.25);
        }
        .option-btn svg { width: 16px; height: 16px; stroke: #f472b6; transition: transform 0.2s; }
        .option-btn:hover svg { transform: translateX(4px); }

        .response-card {
            background: rgba(236, 72, 153, 0.08);
            border: 1px solid rgba(244, 114, 182, 0.3);
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 18px;
            font-size: 13.5px;
            color: #fdf2f8;
            line-height: 1.6;
        }

        .movie-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(244, 114, 182, 0.2);
            color: #fdf2f8;
            padding: 13px 18px;
            border-radius: 16px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .movie-btn:hover {
            border-color: #ec4899;
            background: rgba(236, 72, 153, 0.15);
            color: #fff;
            transform: scale(1.01);
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- Много милых падающих и летающих элементов на фоне -->
<div class="magic-bg">
    <div class="floating-item" style="left: 10%; animation-duration: 9s; font-size: 18px;">🌸</div>
    <div class="floating-item" style="left: 25%; animation-duration: 12s; font-size: 16px;">💖</div>
    <div class="floating-item" style="left: 45%; animation-duration: 8s; font-size: 18px;">🐾</div>
    <div class="floating-item" style="left: 65%; animation-duration: 11s; font-size: 16px;">✨</div>
    <div class="floating-item" style="left: 85%; animation-duration: 10s; font-size: 18px;">🌷</div>
    <div class="floating-item" style="left: 15%; animation-duration: 13s; font-size: 15px;">💖</div>
    <div class="floating-item" style="left: 75%; animation-duration: 9s; font-size: 18px;">🐾</div>
</div>

<div class="container">
    <!-- Шапка с милым котиком -->
    <div class="top-banner">
        <div class="cat-badge">
            <span class="cat-avatar">🐱</span>
            <span>Мур-контроль 🐾</span>
        </div>
        <span class="status-pill">Любимая 💖</span>
    </div>

    <!-- Лента из всех 5 полароидных фото -->
    <div class="polaroid-scroll">
        <div class="polaroid-item"><img src="1.jpg" alt="1"></div>
        <div class="polaroid-item"><img src="2.jpg" alt="2"></div>
        <div class="polaroid-item"><img src="3.jpg" alt="3"></div>
        <div class="polaroid-item"><img src="4.jpg" alt="4"></div>
        <div class="polaroid-item"><img src="5.jpg" alt="5"></div>
    </div>

    <!-- ШАГ 1 -->
    <div id="step-1">
        <h1>Доброе утречко <span class="heart-beat">❤️</span></h1>
        <p class="subtitle">Как твоё самочувствие после ночки? Выбирай честно, твой личный котик следит за лечением!</p>
        <div class="btn-group">
            <button class="option-btn" onclick="selectMood('better')">
                <span>Уже лучше ☀️</span>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
            <button class="option-btn" onclick="selectMood('worse')">
                <span>Не очень 🤒</span>
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </div>

    <!-- ШАГ 2 -->
    <div id="step-2" class="hidden fade-in">
        <div class="response-card" id="response-text"></div>
        <div style="margin-bottom: 16px;">
            <p style="font-size: 11px; font-weight: 800; color: #f472b6; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.8px;">Кинозал на удаленке (Rave) 🍿</p>
            <button class="movie-btn" onclick="finishSelection()"><span>☕️</span> Уютный сериал фоном</button>
            <button class="movie-btn" onclick="finishSelection()"><span>🔥</span> Динамичное кино / боевик</button>
            <button class="movie-btn" onclick="finishSelection()"><span>🌸</span> Легкая комедия</button>
        </div>
        <div id="final-block" class="hidden fade-in response-card" style="text-align: center; border-color: rgba(236, 72, 153, 0.4); background: rgba(236, 72, 153, 0.12);">
            <p style="color: #f472b6; font-weight: 800; font-size: 14px; margin-bottom: 6px;">Всё зафиксировано! 🐾✨</p>
            <p style="color: #fdf2f8; font-size: 13.5px; margin: 0;">Люблю тебя очень-очень сильно. Скоро оба оклемаемся и наобнимаемся за все дни.</p>
        </div>
    </div>
</div>

<script>
    function selectMood(type) {
        document.getElementById('step-1').classList.add('hidden');
        const respBox = document.getElementById('response-text');
        if (type === 'better') {
            respBox.innerHTML = `<strong>Отличные новости! ☀️</strong><br>Меня невероятно радует, что ты идёшь на поправку. Жалко, что мы оба на карантине по разным углам, но как выздоровеем — всё наверстаем. 🌸`;
        } else {
            respBox.innerHTML = `<strong>Принято к исполнению 🛑🐾</strong><br>Организм еще борется, поэтому сегодня строгий режим: плед 🌯, горячий чай 🫖 и полный игнор любых дел. Я на связи рядом.`;
        }
        document.getElementById('step-2').classList.remove('hidden');
    }
    function finishSelection() {
        const finalBlock = document.getElementById('final-block');
        finalBlock.classList.remove('hidden');
        finalBlock.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
